<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ruchir Gupta (RG) Logo">
  <defs>
    <!-- Deep Terminal Chassis Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a150e"/>
      <stop offset="100%" stop-color="#020503"/>
    </linearGradient>
    <!-- Subtle Phosphor Glow Filter -->
    <filter id="phosphor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#00ff66" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal Chassis / Rounded Badge (.brand-monogram) -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13" fill="url(#term-bg)" stroke="#00ff66" stroke-width="2.5"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="10" fill="#00ff66" fill-opacity="0.08"/>

  <!-- Logo Monogram 'RG' -->
  <text 
    x="32" 
    y="43" 
    fill="#00ff66" 
    font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Menlo, Consolas, Monaco, monospace" 
    font-size="28" 
    font-weight="800" 
    letter-spacing="-1.2" 
    text-anchor="middle"
    filter="url(#phosphor-glow)">RG</text>
</svg>
